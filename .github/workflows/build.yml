name: Build & Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VRLyrics.sln

      - name: Run unit tests
        run: dotnet test VRLyrics.sln -c Release --no-restore

      - name: Build lightweight package
        run: pwsh -ExecutionPolicy Bypass -File .\publish.ps1

      - name: Build standalone self-contained package
        run: pwsh -ExecutionPolicy Bypass -File .\publish.ps1 -SelfContained

      - name: Package release archives
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path "release_assets" | Out-Null

          $stage1 = "stage_standalone\VRLyrics"
          New-Item -ItemType Directory -Force -Path $stage1 | Out-Null
          Copy-Item "dist\VRLyrics-win-x64-selfcontained\VRLyrics.exe" $stage1 -Force
          Compress-Archive -Path "stage_standalone\VRLyrics" -DestinationPath "release_assets\VRLyrics-$tag-Standalone-win-x64.zip" -Force

          $stage2 = "stage_light\VRLyrics"
          New-Item -ItemType Directory -Force -Path $stage2 | Out-Null
          Copy-Item "dist\VRLyrics-win-x64\*" $stage2 -Force
          Compress-Archive -Path "stage_light\VRLyrics" -DestinationPath "release_assets\VRLyrics-$tag-win-x64.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.zip
          generate_release_notes: true
